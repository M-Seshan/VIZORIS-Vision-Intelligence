    <line x1="140" y1="660" x2="710" y2="660"/>
    <line x1="140" y1="690" x2="710" y2="690"/>
    <line x1="140" y1="720" x2="710" y2="720"/>
    <line x1="140" y1="750" x2="710" y2="750"/>
    <line x1="140" y1="780" x2="710" y2="780"/>
    <line x1="140" y1="810" x2="710" y2="810"/>
    <line x1="140" y1="840" x2="710" y2="840"/>
    <line x1="140" y1="870" x2="710" y2="870"/>
    <line x1="140" y1="900" x2="710" y2="900"/>
  </g>

  <!-- CONTROLLED DEFECT: SPIRAL PUNCH / BINDING MISALIGNMENT -->
  <!-- Notice holes shifted heavily outward and distorted wire angles in middle segment -->
  <g id="defect-binding">
    <!-- Regular Top Holes -->
    <ellipse cx="95" cy="80" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="125" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="170" rx="8" ry="12" fill="#1e293b"/>
    <!-- MISALIGNED SKEWED HOLES (Shifted towards edge & diagonal angle) -->
    <ellipse cx="78" cy="218" rx="10" ry="14" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="78" cy="218" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="74" cy="265" rx="11" ry="15" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="74" cy="265" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="73" cy="312" rx="11" ry="15" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="73" cy="312" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="76" cy="358" rx="10" ry="14" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="76" cy="358" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="80" cy="402" rx="9" ry="13" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="1.5"/>
    <ellipse cx="80" cy="402" rx="8" ry="12" fill="#1e293b"/>
    <!-- Normal bottom holes -->
    <ellipse cx="95" cy="445" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="485" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="530" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="575" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="620" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="665" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="710" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="755" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="800" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="845" rx="8" ry="12" fill="#1e293b"/>
    <ellipse cx="95" cy="890" rx="8" ry="12" fill="#1e293b"/>

    <!-- Twisted distorted wires -->
    <path d="M 60 76 C 45 76, 45 84, 98 84" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 121 C 45 121, 45 129, 98 129" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 166 C 45 166, 45 174, 98 174" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <!-- Bent wires -->
    <path d="M 46 208 C 30 208, 35 224, 82 222" fill="none" stroke="url(#spiralWire)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 44 252 C 26 250, 32 270, 78 268" fill="none" stroke="url(#spiralWire)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 44 298 C 28 296, 32 316, 76 314" fill="none" stroke="url(#spiralWire)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 48 344 C 34 344, 38 360, 80 360" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 54 390 C 42 390, 44 404, 84 404" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>

    <path d="M 60 441 C 45 441, 45 449, 98 449" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 481 C 45 481, 45 489, 98 489" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 526 C 45 526, 45 534, 98 534" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 571 C 45 571, 45 579, 98 579" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 616 C 45 616, 45 624, 98 624" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 661 C 45 661, 45 669, 98 669" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 706 C 45 706, 45 714, 98 714" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 751 C 45 751, 45 759, 98 759" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 796 C 45 796, 45 804, 98 804" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 841 C 45 841, 45 849, 98 849" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 60 886 C 45 886, 45 894, 98 894" fill="none" stroke="url(#spiralWire)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
