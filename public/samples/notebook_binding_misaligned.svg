<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf9f5"/>
      <stop offset="100%" stop-color="#f2efe9"/>
    </linearGradient>
    <linearGradient id="spiralWire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#000000" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#080c14"/>

  <!-- Notebook Body -->
  <g filter="url(#shadow)">
    <rect x="70" y="50" width="660" height="900" rx="14" ry="14" fill="url(#paperGrad)"/>
    <rect x="70" y="50" width="660" height="900" rx="14" ry="14" fill="url(#dotPattern)"/>
  </g>

  <!-- Left Spine Margin Binding Strip -->
  <rect x="70" y="50" width="60" height="900" rx="4" fill="#000000" opacity="0.03"/>
  <line x1="130" y1="50" x2="130" y2="950" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Vertical Red Margin Line -->
  <line x1="200" y1="90" x2="200" y2="920" stroke="#f43f5e" stroke-width="2" opacity="0.8"/>

  <!-- Top Header Box -->
  <rect x="145" y="85" width="560" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="165" y="115" font-family="'Rajdhani', 'Inter', monospace" font-size="14" font-weight="700" fill="#334155" letter-spacing="1.5">PRODUCT ID: NB-00127</text>
  <text x="165" y="136" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">STANDARD COLLEGE RULED • 80 GSM OPTICAL WHITE</text>
  
  <text x="540" y="115" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#475569">DATE: ___/___/2026</text>
  <text x="540" y="136" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#475569">PAGE: 01</text>

  <!-- Horizontal Ruled Blue Lines -->
  <g stroke="#93c5fd" stroke-width="1.2" opacity="0.75">
    <line x1="140" y1="180" x2="710" y2="180"/>
    <line x1="140" y1="210" x2="710" y2="210"/>
    <line x1="140" y1="240" x2="710" y2="240"/>
    <line x1="140" y1="270" x2="710" y2="270"/>
    <line x1="140" y1="300" x2="710" y2="300"/>
    <line x1="140" y1="330" x2="710" y2="330"/>
    <line x1="140" y1="360" x2="710" y2="360"/>
    <line x1="140" y1="390" x2="710" y2="390"/>
    <line x1="140" y1="420" x2="710" y2="420"/>
    <line x1="140" y1="450" x2="710" y2="450"/>
    <line x1="140" y1="480" x2="710" y2="480"/>
    <line x1="140" y1="510" x2="710" y2="510"/>
    <line x1="140" y1="540" x2="710" y2="540"/>
    <line x1="140" y1="570" x2="710" y2="570"/>
    <line x1="140" y1="600" x2="710" y2="600"/>
